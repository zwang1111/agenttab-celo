name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forge-test:
    name: forge test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - run: forge test
